<!-- =========================================
     EBOOK ROTATION + CART SCRIPT
========================================= -->

<script>


/* =========================================
   EBOOK DATA
========================================= */

const ebooks = [

    {
        id:
            "look-20-years-younger",

        name:
            "How to Look 20 Years Younger Than Your Age",

        image:
            "images/How-to-Look-20-Years-Younger-Than-Your-Age.png",

        description:
            "Practical strategies for skincare, nutrition, movement, sleep and healthy aging.",

        price:
            17,

        priceId:
            "price_1TtXCXRtp4gVtODyNK9vhXIm",

        stripe:
            "https://buy.stripe.com/8x228tcswgOQeDJe1d8N20i"

    },


    {
        id:
            "natural-anti-aging",

        name:
            "The Natural Anti-Aging Guide",

        image:
            "images/The-Natural-Anti-Aging-Guide.png",

        description:
            "A practical wellness guide covering nutrition, exercise, sleep and skincare.",

        price:
            17,

        priceId:
            "price_1TupuwRtp4gVtODyHnJCanv1",

        stripe:
            "https://buy.stripe.com/eVqfZj1NS5681QX2iv8N20k"

    },


    {
        id:
            "longevity-blueprint",

        name:
            "The Longevity Blueprint",

        image:
            "images/the-longevity-blueprint-cover.png",

        description:
            "A practical guide to nutrition, movement, sleep, mindset and prevention.",

        price:
            17,

        priceId:
            "price_1TxiMYRtp4gVtODy5zcyFkVG",

        stripe:
            "https://buy.stripe.com/00w7sN3W08ik8flaP18N20q"

    },


    {
        id:
            "healthy-hormones",

        name:
            "The Healthy Hormones & Vitality Guide",

        image:
            "images/healthy-hormones-cover.png",

        description:
            "An educational guide covering hormones, nutrition, sleep, movement and everyday vitality.",

        price:
            17,

        priceId:
            "",

        stripe:
            ""

    }

];


/* =========================================
   CART
========================================= */

let ebookCart =
    JSON.parse(
        localStorage.getItem(
            "theBestBundleCart"
        )
    ) || [];


const pageCartCount =
    document.getElementById(
        "pageCartCount"
    );


function updatePageCartCount(){

    pageCartCount.textContent =
        ebookCart.length;

}


function saveEbookCart(){

    localStorage.setItem(
        "theBestBundleCart",
        JSON.stringify(
            ebookCart
        )
    );

    updatePageCartCount();

}


/* =========================================
   PRODUCT GRID
========================================= */

const productsGrid =
    document.getElementById(
        "productsGrid"
    );


/* =========================================
   ROTATION INDEX
========================================= */

let rotationIndex = 0;


/* =========================================
   DETERMINE NUMBER OF VISIBLE PRODUCTS
========================================= */

function getVisibleProductCount(){

    const width =
        window.innerWidth;


    /*
        Portrait phone:
        2 eBooks
    */

    if(width <= 650){

        return 2;

    }


    /*
        Landscape phone,
        tablet and desktop:
        3 eBooks
    */

    return 3;

}


/* =========================================
   GET CURRENT GROUP OF EBOOKS
========================================= */

function getVisibleEbooks(){

    const visibleCount =
        getVisibleProductCount();


    const visible = [];


    for(
        let i = 0;
        i < visibleCount;
        i++
    ){

        const index =
            (
                rotationIndex + i
            ) % ebooks.length;


        visible.push(
            ebooks[index]
        );

    }


    return visible;

}


/* =========================================
   CREATE PRODUCT CARD
========================================= */

function createProductCard(
    product
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "product-card";


    card.innerHTML = `

        <div class="product-image">

            <img
                src="${product.image}"
                alt="${product.name}">

        </div>


        <div class="product-info">

            <div class="product-label">
                Premium eBook
            </div>


            <h2>
                ${product.name}
            </h2>


            <p>
                ${product.description}
            </p>


            <div class="product-price">
                $${product.price}
            </div>


            <div class="product-actions">

                <a
                    href="${product.stripe || "#"}"
                    class="btn buy-button">

                    Buy Now

                </a>


                <button
                    type="button"
                    class="btn cart-button add-to-cart"

                    data-id="${product.id}"

                    data-name="${product.name}"

                    data-price="${product.price}"

                    data-price-id="${product.priceId}"

                    data-image="${product.image}"

                    data-stripe="${product.stripe}">

                    Add to Cart

                </button>

            </div>

        </div>

    `;


    return card;

}


/* =========================================
   RENDER PRODUCT CARDS
========================================= */

function renderProductCards(){

    productsGrid.innerHTML = "";


    const visibleEbooks =
        getVisibleEbooks();


    visibleEbooks.forEach(
        function(product){

            productsGrid.appendChild(
                createProductCard(
                    product
                )
            );

        }
    );

}


/* =========================================
   RENDER PRODUCTS WITH ANIMATION
========================================= */

function renderProducts(
    animate = false
){

    if(!animate){

        renderProductCards();

        return;

    }


    productsGrid.classList.add(
        "is-changing"
    );


    setTimeout(
        function(){

            renderProductCards();


            /*
                Remove the fading class
                after the new cards are inserted.
            */

            requestAnimationFrame(
                function(){

                    productsGrid.classList.remove(
                        "is-changing"
                    );

                }
            );

        },
        350
    );

}


/* =========================================
   INITIAL DISPLAY
========================================= */

renderProducts();


/* =========================================
   AUTOMATIC EBOOK ROTATION
========================================= */

/*
    IMPORTANT:

    We move by the number of visible cards.

    Portrait:
        1 + 2
        then 3 + 4
        then 1 + 2

    Landscape:
        1 + 2 + 3
        then 4 + 1 + 2
        then 3 + 4 + 1

    The rotation happens every 10 seconds.
*/

function rotateEbooks(){

    const visibleCount =
        getVisibleProductCount();


    rotationIndex =
        (
            rotationIndex +
            visibleCount
        ) % ebooks.length;


    renderProducts(true);

}


/*
    10,000 milliseconds
    =
    10 seconds
*/

let rotationTimer =
    setInterval(
        rotateEbooks,
        10000
    );


/* =========================================
   HANDLE SCREEN ROTATION / RESIZE
========================================= */

let previousVisibleCount =
    getVisibleProductCount();


window.addEventListener(
    "resize",
    function(){

        const currentVisibleCount =
            getVisibleProductCount();


        if(
            currentVisibleCount !==
            previousVisibleCount
        ){

            previousVisibleCount =
                currentVisibleCount;


            /*
                Keep the rotation
                aligned with the new
                number of columns.
            */

            rotationIndex =
                Math.floor(
                    rotationIndex /
                    currentVisibleCount
                ) *
                currentVisibleCount;


            rotationIndex =
                rotationIndex %
                ebooks.length;


            renderProducts();

        }

    }
);


/* =========================================
   ADD TO CART
========================================= */

productsGrid.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                ".add-to-cart"
            );


        if(!button){

            return;

        }


        const product = {

            id:
                button.dataset.id,

            name:
                button.dataset.name,

            price:
                Number(
                    button.dataset.price
                ),

            image:
                button.dataset.image,

            stripe:
                button.dataset.stripe,

            priceId:
                button.dataset.priceId

        };


        const alreadyExists =
            ebookCart.some(
                function(item){

                    return (
                        item.id ===
                        product.id
                    );

                }
            );


        if(!alreadyExists){

            ebookCart.push(
                product
            );

            saveEbookCart();

        }


        button.textContent =
            "✓ Added";


        setTimeout(
            function(){

                if(
                    document.body.contains(
                        button
                    )
                ){

                    button.textContent =
                        "Add to Cart";

                }

            },
            1200
        );

    }
);


/* =========================================
   CART BUTTON
========================================= */

document
    .getElementById(
        "pageCartButton"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "cart.html";

        }
    );


/* =========================================
   BACK BUTTON
========================================= */

function returnToPreviousPage(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =========================================
   INITIAL CART COUNT
========================================= */

updatePageCartCount();


</script>
