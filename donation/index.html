<style>

<body>

  <style>

/* ===== Toggle Buttons ===== */

.donation-toggle{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:35px;

}

.toggle-btn{

height:82px;

border:2px solid #d1d5db;

border-radius:20px;

background:#ffffff;

font-size:30px;

font-weight:500;

cursor:pointer;

transition:.25s;

color:#3b82f6;

}

.toggle-btn.active{

background:#17284b;

color:#ffffff;

border-color:#17284b;

}

.toggle-btn:disabled{

cursor:not-allowed;

opacity:1;

}

/* ===== Amount Buttons ===== */

.amount-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-bottom:30px;

}

.amount-btn{

height:78px;

border:2px solid #d1d5db;

border-radius:18px;

background:#ffffff;

font-size:28px;

font-weight:600;

cursor:pointer;

transition:.25s;

color:#3b82f6;

}

.amount-btn.selected{

background:#17284b;

border-color:#17284b;

color:#ffffff;

}

/* ===== Inputs ===== */

.form-group{

margin-bottom:22px;

}

.form-group input{

width:100%;

height:78px;

border:2px solid #d1d5db;

border-radius:18px;

padding:0 24px;

font-size:24px;

outline:none;

}

.form-group input:focus{

border-color:#3b82f6;

}

/* ===== Continue Button ===== */

.continue-btn{

width:100%;

height:82px;

margin-top:12px;

border:none;

border-radius:20px;

background:#17284b;

color:#ffffff;

font-size:28px;

font-weight:700;

cursor:pointer;

transition:.25s;

}

.continue-btn:hover{

opacity:.92;

}

/* ===== Stripe Note ===== */

.secure-note{

margin-top:18px;

text-align:center;

font-size:18px;

color:#6b7280;

}

/* ===== Thank You ===== */

.thank-you{

margin-top:50px;

padding-top:35px;

border-top:1px solid #e5e7eb;

text-align:center;

}

.thank-you h3{

font-size:32px;

margin-bottom:10px;

color:#17284b;

}

.thank-you p{

font-size:19px;

color:#6b7280;

}

/* ===== Return Home ===== */

.return-home{

margin-top:35px;

text-align:center;

}

.return-home a{

display:inline-block;

padding:16px 34px;

border-radius:14px;

background:#17284b;

color:#ffffff;

text-decoration:none;

font-weight:600;

}

@media(max-width:768px){

.donation-toggle{

grid-template-columns:1fr 1fr;

gap:14px;

}

.toggle-btn{

font-size:18px;

height:62px;

}

.amount-grid{

grid-template-columns:repeat(3,1fr);

gap:14px;

}

.amount-btn{

height:60px;

font-size:20px;

}

.form-group input{

height:62px;

font-size:18px;

}

.continue-btn{

height:64px;

font-size:20px;

}

}

</style>

  <script>

let selectedStripeLink = "";

const amountButtons = document.querySelectorAll(".amount-btn");

amountButtons.forEach(button => {

button.addEventListener("click", function(){

amountButtons.forEach(btn => btn.classList.remove("selected"));

this.classList.add("selected");

selectedStripeLink = this.dataset.link;

});

});

document.getElementById("continueDonate").addEventListener("click", function(){

if(selectedStripeLink === ""){

alert("Please select a donation amount.");

return;

}

window.location.href = selectedStripeLink;

});

</script>
