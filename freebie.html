<style>

  :root{
    --navy:#071A33;
    --gold:#F4C542;
    --gold-dark:#D9A91A;
    --white:#FFFFFF;
    --off-white:#F8FAFC;
    --text-gray:#64748B;
    --border:#E2E8F0;
    --max-width:1200px;
    --radius:14px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--off-white);
    color:var(--navy);
    line-height:1.6;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
    cursor:pointer;
}

.container{
    width:90%;
    max-width:var(--max-width);
    margin:0 auto;
}


/* HEADER */

.page-header{
    background:var(--navy);
    color:var(--white);
}

.header-inner{
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-logo img{
    height:70px;
    width:auto;
}

.home-button{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    color:var(--white);
    font-size:23px;
}

.home-button:hover{
    background:rgba(255,255,255,.08);
    color:var(--gold);
}


/* BACK */

.back-row{
    background:var(--white);
    border-bottom:1px solid var(--border);
}

.back-inner{
    min-height:60px;
    display:flex;
    align-items:center;
}

.back-button{
    display:inline-flex;
    align-items:center;
    gap:9px;
    border:none;
    background:transparent;
    color:var(--navy);
    font-weight:700;
}

.back-button:hover{
    color:var(--gold-dark);
}


/* HERO */

.freebie-hero{
    background:var(--navy);
    color:var(--white);
    padding:80px 0 100px;
    text-align:center;
}

.free-label{
    display:inline-block;
    padding:7px 16px;
    margin-bottom:20px;
    border-radius:30px;
    background:var(--gold);
    color:var(--navy);
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
}

.freebie-content{
    max-width:800px;
    margin:0 auto;
}

.freebie-content h1{
    font-size:clamp(42px,7vw,64px);
    line-height:1.1;
    margin-bottom:20px;
}

.freebie-content p{
    color:rgba(255,255,255,.82);
    font-size:18px;
    line-height:1.8;
}


/* FREE RESOURCES */

.resources-section{
    padding:80px 0 100px;
}

.section-heading{
    text-align:center;
    margin-bottom:55px;
}

.section-heading h2{
    font-size:clamp(30px,5vw,44px);
    margin-bottom:14px;
}

.section-heading p{
    color:var(--text-gray);
    font-size:17px;
}

.resources-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
}

.resource-card{
    display:flex;
    flex-direction:column;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 10px 30px rgba(7,26,51,.08);
}

.resource-image{
    padding:28px;
    background:var(--off-white);
}

.resource-image img{
    max-width:240px;
    margin:0 auto;
}

.resource-info{
    padding:26px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.resource-label{
    color:var(--gold-dark);
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:8px;
}

.resource-info h3{
    font-size:24px;
    margin-bottom:12px;
}

.resource-info p{
    color:var(--text-gray);
    margin-bottom:22px;
}

.read-button{
    margin-top:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:50px;
    border-radius:8px;
    background:var(--gold);
    color:var(--navy);
    font-weight:800;
}

.read-button:hover{
    background:var(--gold-dark);
}


/* FOOTER */

.footer{
    background:var(--navy);
    color:var(--white);
    padding:35px 0;
    text-align:center;
}

.footer-tagline{
    color:var(--gold);
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:7px;
}

.footer p{
    color:rgba(255,255,255,.7);
    font-size:13px;
}


/* RESPONSIVE */

@media(max-width:950px){

    .resources-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .resources-grid{
        grid-template-columns:1fr;
    }

    .resource-card{
        max-width:430px;
        margin:0 auto;
    }

    .freebie-hero{
        padding:60px 0 75px;
    }

}
