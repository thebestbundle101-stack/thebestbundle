<!-- =========================================

<script>


/* =========================================
   BUNDLE DATA
========================================= */

const bundles = [

    {
        id:
            "starter-bundle",

        name:
            "Starter Bundle",

        label:
            "Starter Collection",

        image:
            "images/starter-bundle.png",

        description:
            "A complete starter collection of premium health and wellness digital resources. Includes Resell Rights.",

        includes:
            "2 Premium eBooks + 4 Professional Templates",

        price:
            27,

        priceId:
            "price_1TweJORtp4gVtODymXOzvXjB",

        stripe:
            "https://buy.stripe.com/28E6oJ504fKMfHNf5h8N20p",

        active:
            true

    },


    {
        id:
            "creator-bundle",

        name:
            "Creator Bundle",

        label:
            "Creator Collection",

        image:
            "images/creator-bundle.png",

        description:
            "A premium collection combining powerful wellness eBooks with professionally designed planners and templates. Includes Master Resell Rights.",

        includes:
            "3 Premium eBooks + 6 Professional Templates",

        price:
            37,

        priceId:
            "price_1UA3lXRtp4gVtODyq54xMbhJ",

        stripe:
            "https://buy.stripe.com/9B614p1NSeGI9jp9KX8N20z",

        active:
            true

    },


    {
        id:
            "pro-bundle",

        name:
            "Pro Bundle",

        label:
            "Pro Collection",

        image:
            "images/pro-bundle.png",

        description:
            "An expanded collection for customers looking for a larger premium digital library.",

        includes:
            "5 Premium eBooks + 10 Professional Templates",

        price:
            57,

        active:
            false,

        badge:
            "Coming Soon"

    },


    {
        id:
            "vault-bundle",

        name:
            "Vault Bundle",

        label:
            "Vault Collection",

        image:
            "images/vault-bundle.png",

        description:
            "The ultimate TheBestBundle collection designed to deliver our largest selection of premium digital resources.",

        includes:
            "10 Premium eBooks + 20 Professional Templates",

        price:
            97,

        active:
            false,

        badge:
            "Best Value • Coming Soon"

    }

];


/* =========================================
   CART
========================================= */

let bundleCart =
    JSON.parse(
        localStorage.getItem(
            "theBestBundleCart"
        )
    ) || [];


const pageCartCount =
    document.getElementById(
        "pageCartCount"
    );


function updatePageCartCount(){

    pageCartCount.textContent =
        bundleCart.length;

}


function saveBundleCart(){

    localStorage.setItem(
        "theBestBundleCart",
        JSON.stringify(
            bundleCart
        )
    );

    updatePageCartCount();

}


/* =========================================
   BUNDLE GRID
========================================= */

const bundleGrid =
    document.getElementById(
        "bundleGrid"
    );


/* =========================================
   ROTATION POSITION
========================================= */

let rotationIndex = 0;


/* =========================================
   GET CURRENT BUNDLE ORDER
========================================= */

function getOrderedBundles(){

    const orderedBundles = [];


    for(
        let i = 0;
        i < bundles.length;
        i++
    ){

        const index =
            (
                rotationIndex + i
            ) % bundles.length;


        orderedBundles.push(
            bundles[index]
        );

    }


    return orderedBundles;

}


/* =========================================
   CREATE ACTIVE BUNDLE CARD
========================================= */

function createActiveBundleCard(
    bundle
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "bundle-card";


    card.innerHTML = `

        <div class="bundle-image">

            <img
                src="${bundle.image}"
                alt="${bundle.name}">

        </div>


        <div class="bundle-info">

            <div class="bundle-label">

                ${bundle.label}

            </div>


            <h2>

                ${bundle.name}

            </h2>


            <p>

                ${bundle.description}

            </p>


            <div class="bundle-includes">

                ${bundle.includes}

            </div>


            <div class="bundle-price">

                $${bundle.price}

            </div>


            <div class="bundle-actions">

                <a
                    href="${bundle.stripe}"
                    class="btn buy-button">

                    Buy Now

                </a>


                <button
                    type="button"
                    class="btn cart-button add-to-cart"

                    data-id="${bundle.id}"

                    data-name="${bundle.name}"

                    data-price="${bundle.price}"

                    data-price-id="${bundle.priceId}"

                    data-image="${bundle.image}"

                    data-stripe="${bundle.stripe}">

                    Add to Cart

                </button>

            </div>

        </div>

    `;


    return card;

}


/* =========================================
   CREATE COMING SOON CARD
========================================= */

function createComingSoonCard(
    bundle
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "bundle-card";


    card.innerHTML = `

        <div class="bundle-image">

            <img
                src="${bundle.image}"
                alt="${bundle.name}">

        </div>


        <div class="bundle-info">

            <span class="coming-badge">

                ${bundle.badge}

            </span>


            <div class="bundle-label">

                ${bundle.label}

            </div>


            <h2>

                ${bundle.name}

            </h2>


            <p>

                ${bundle.description}

            </p>


            <div class="bundle-includes">

                ${bundle.includes}

            </div>


            <div class="bundle-price">

                $${bundle.price}

            </div>


            <button
                type="button"
                class="btn coming-button"
                disabled>

                Coming Soon

            </button>

        </div>

    `;


    return card;

}


/* =========================================
   CREATE BUNDLE CARD
========================================= */

function createBundleCard(
    bundle
){

    if(
        bundle.active
    ){

        return createActiveBundleCard(
            bundle
        );

    }


    return createComingSoonCard(
        bundle
    );

}


/* =========================================
   RENDER ALL BUNDLES
========================================= */

function renderBundleCards(){

    bundleGrid.innerHTML = "";


    const orderedBundles =
        getOrderedBundles();


    orderedBundles.forEach(
        function(bundle){

            bundleGrid.appendChild(
                createBundleCard(
                    bundle
                )
            );

        }
    );

}


/* =========================================
   RENDER WITH ANIMATION
========================================= */

function renderBundles(
    animate = false
){

    if(!animate){

        renderBundleCards();

        return;

    }


    bundleGrid.classList.add(
        "is-changing"
    );


    setTimeout(
        function(){

            renderBundleCards();


            requestAnimationFrame(
                function(){

                    bundleGrid.classList.remove(
                        "is-changing"
                    );

                }
            );

        },
        350
    );

}


/* =========================================
   INITIAL DISPLAY
========================================= */

renderBundles();


/* =========================================
   AUTOMATIC ROTATION
   EVERY 10 SECONDS
========================================= */

function rotateBundles(){

    rotationIndex =
        (
            rotationIndex + 1
        ) % bundles.length;


    renderBundles(
        true
    );

}


let bundleRotationTimer =
    setInterval(
        rotateBundles,
        10000
    );


/* =========================================
   ADD TO CART
========================================= */

bundleGrid.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                ".add-to-cart"
            );


        if(!button){

            return;

        }


        const product = {

            id:
                button.dataset.id,

            name:
                button.dataset.name,

            price:
                Number(
                    button.dataset.price
                ),

            image:
                button.dataset.image,

            stripe:
                button.dataset.stripe,

            priceId:
                button.dataset.priceId

        };


        const alreadyExists =
            bundleCart.some(
                function(item){

                    return (
                        item.id ===
                        product.id
                    );

                }
            );


        if(!alreadyExists){

            bundleCart.push(
                product
            );

            saveBundleCart();

        }


        button.textContent =
            "✓ Added";


        setTimeout(
            function(){

                if(
                    document.body.contains(
                        button
                    )
                ){

                    button.textContent =
                        "Add to Cart";

                }

            },
            1200
        );

    }
);

document
    .getElementById(

    )

/* =========================================

========================================= */

function returnToPreviousPage(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }

    else{

        window.location.href =
            "index.html";

    }

}
