/* =========================================
   CART
========================================= */

let templateCart =
    JSON.parse(
        localStorage.getItem(
            "theBestBundleCart"
        )
    ) || [];


const pageCartCount =
    document.getElementById(
        "pageCartCount"
    );


function updatePageCartCount(){

    pageCartCount.textContent =
        templateCart.length;

}


function saveTemplateCart(){

    localStorage.setItem(
        "theBestBundleCart",
        JSON.stringify(
            templateCart
        )
    );

    updatePageCartCount();

}


/* =========================================
   PRODUCT GRID
========================================= */

const productsGrid =
    document.getElementById(
        "productsGrid"
    );


/* =========================================
   ROTATION POSITION
========================================= */

/*
    All 10 templates are ALWAYS
    displayed.

    Every 10 seconds the order
    changes.

    With 10 templates, the order
    rotates one position at a time.
*/

let rotationIndex = 0;


/* =========================================
   GET CURRENT TEMPLATE ORDER
========================================= */

function getOrderedTemplates(){

    const orderedTemplates = [];

    for(
        let i = 0;
        i < templates.length;
        i++
    ){

        const index =
            (
                rotationIndex + i
            ) % templates.length;


        orderedTemplates.push(
            templates[index]
        );

    }


    return orderedTemplates;

}


/* =========================================
   CREATE TEMPLATE CARD
========================================= */

function createTemplateCard(
    template
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "product-card";


    card.innerHTML = `

        <div class="product-image">

            <img
                src="${template.image}"
                alt="${template.name}">

        </div>


        <div class="product-info">

            <div class="product-label">
                Printable Template
            </div>


            <h2>
                ${template.name}
            </h2>


            <p>
                ${template.description}
            </p>


            <div class="product-price">
                $${template.price}
            </div>


            <div class="product-actions">

                <a
                    href="${template.stripe}"
                    class="btn buy-button">

                    Buy Now

                </a>


                <button
                    type="button"
                    class="btn cart-button add-to-cart"

                    data-id="${template.id}"

                    data-name="${template.name}"

                    data-price="${template.price}"

                    data-price-id="${template.priceId}"

                    data-image="${template.image}"

                    data-stripe="${template.stripe}">

                    Add to Cart

                </button>

            </div>

        </div>

    `;


    return card;

}


/* =========================================
   RENDER ALL TEMPLATES
========================================= */

function renderTemplateCards(){

    productsGrid.innerHTML = "";


    const orderedTemplates =
        getOrderedTemplates();


    orderedTemplates.forEach(
        function(template){

            productsGrid.appendChild(
                createTemplateCard(
                    template
                )
            );

        }
    );

}


/* =========================================
   RENDER WITH ANIMATION
========================================= */

function renderTemplates(
    animate = false
){

    if(!animate){

        renderTemplateCards();

        return;

    }


    productsGrid.classList.add(
        "is-changing"
    );


    setTimeout(
        function(){

            renderTemplateCards();


            requestAnimationFrame(
                function(){

                    productsGrid.classList.remove(
                        "is-changing"
                    );

                }
            );

        },
        350
    );

}


/* =========================================
   INITIAL DISPLAY
========================================= */

renderTemplates();


/* =========================================
   AUTOMATIC ROTATION
   EVERY 10 SECONDS
========================================= */

function rotateTemplates(){

    /*
        Move every template
        one position.

        All 10 templates remain visible.
    */

    rotationIndex =
        (
            rotationIndex + 1
        ) % templates.length;


    renderTemplates(true);

}


/*
    10,000 milliseconds
    =
    10 seconds
*/

let templateRotationTimer =
    setInterval(
        rotateTemplates,
        10000
    );


/* =========================================
   ADD TO CART
========================================= */

productsGrid.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                ".add-to-cart"
            );


        if(!button){

            return;

        }


        const product = {

            id:
                button.dataset.id,

            name:
                button.dataset.name,

            price:
                Number(
                    button.dataset.price
                ),

            image:
                button.dataset.image,

            stripe:
                button.dataset.stripe,

            priceId:
                button.dataset.priceId

        };


        const alreadyExists =
            templateCart.some(
                function(item){

                    return (
                        item.id ===
                        product.id
                    );

                }
            );


        if(!alreadyExists){

            templateCart.push(
                product
            );

            saveTemplateCart();

        }


        button.textContent =
            "✓ Added";


        setTimeout(
            function(){

                if(
                    document.body.contains(
                        button
                    )
                ){

                    button.textContent =
                        "Add to Cart";

                }

            },
            1200
        );

    }
);


/* =========================================
   CART BUTTON
========================================= */

document
    .getElementById(
        "pageCartButton"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "cart.html";

        }
    );


/* =========================================
   BACK BUTTON
========================================= */

function returnToPreviousPage(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =========================================
   INITIAL CART COUNT
========================================= */

updatePageCartCount();


</script>
