     CREATE A NEW FILE: ebooks.html

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    eBooks | TheBestBundle
</title>

<meta
    name="description"
    content="Explore premium digital eBooks from TheBestBundle.">

<meta
    name="theme-color"
    content="#071A33">

<link
    rel="icon"
    href="/thebestbundle/images/favicon.ico"
    type="image/x-icon">

<link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/thebestbundle/images/favicon.png">

<link
    rel="apple-touch-icon"
    href="/thebestbundle/images/favicon.png">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

:root{
    --navy:#071A33;
    --navy-light:#0D2B50;
    --gold:#F4C542;
    --gold-dark:#D9A91A;
    --white:#FFFFFF;
    --off-white:#F8FAFC;
    --text-dark:#172033;
    --text-gray:#64748B;
    --border:#E2E8F0;
    --max-width:1200px;
    --radius:14px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--off-white);
    color:var(--navy);
    line-height:1.6;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font:inherit;
    cursor:pointer;
}

.container{
    width:90%;
    max-width:var(--max-width);
    margin:0 auto;
}


/* HEADER */

.page-header{
    background:var(--navy);
    color:var(--white);
}

.header-inner{
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.header-logo img{
    height:70px;
    width:auto;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.header-icon{
    position:relative;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    border-radius:8px;
    background:transparent;
    color:var(--white);
    font-size:24px;
}

.header-icon:hover{
    background:rgba(255,255,255,.08);
    color:var(--gold);
}

.cart-count{
    position:absolute;
    top:0;
    right:0;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:30px;
    background:var(--gold);
    color:var(--navy);
    font-size:11px;
    font-weight:800;
    line-height:19px;
}


/* BACK BUTTON */

.back-row{
    background:var(--white);
    border-bottom:1px solid var(--border);
}

.back-inner{
    min-height:60px;
    display:flex;
    align-items:center;
}

.back-button{
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:var(--navy);
    font-weight:700;
    border:none;
    background:transparent;
}

.back-button:hover{
    color:var(--gold-dark);
}


/* PAGE INTRO */

.page-hero{
    background:var(--navy);
    color:var(--white);
    padding:75px 0 90px;
    text-align:center;
}

.page-hero span{
    display:block;
    color:var(--gold);
    font-size:14px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:15px;
}

.page-hero h1{
    font-size:clamp(40px,7vw,64px);
    line-height:1.1;
    margin-bottom:20px;
}

.page-hero p{
    max-width:700px;
    margin:0 auto;
    color:rgba(255,255,255,.82);
    font-size:18px;
}


/* PRODUCTS */

.products-section{
    padding:80px 0 100px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:28px;
}

.product-card{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(7,26,51,.08);
}

.product-image{
    min-height:330px;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--off-white);
}

.product-image img{
    width:100%;
    max-width:240px;
    max-height:300px;
    object-fit:contain;
}

.product-info{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:25px;
}

.product-label{
    color:var(--gold-dark);
    font-size:12px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.product-info h2{
    font-size:22px;
    line-height:1.3;
    margin-bottom:12px;
}

.product-info p{
    color:var(--text-gray);
    font-size:15px;
    margin-bottom:18px;
}

.product-price{
    margin-top:auto;
    margin-bottom:18px;
    font-size:25px;
    font-weight:800;
}

.product-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(140px,1fr));
    gap:10px;
}

.btn{
    min-height:48px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    border:none;
    font-size:14px;
    font-weight:800;
    text-align:center;
}

.buy-button{
    background:var(--gold);
    color:var(--navy);
}

.cart-button{
    background:var(--navy);
    color:var(--white);
    border:2px solid var(--navy);
    white-space:nowrap;
}

.cart-button:hover{
    background:var(--navy);
    color:var(--white);
}


/* FOOTER */

.footer{
    background:var(--navy);
    color:var(--white);
    padding:35px 0;
    text-align:center;
}

.footer-tagline{
    color:var(--gold);
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:7px;
}

.footer p{
    color:rgba(255,255,255,.7);
    font-size:13px;
}


/* RESPONSIVE */

@media(max-width:950px){

    .products-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    .products-grid{
        grid-template-columns:1fr;
    }

    .product-card{
        max-width:430px;
        width:100%;
        margin:0 auto;
    }

    .page-hero{
        padding:60px 0 70px;
    }

}

@media(max-width:380px){

    .product-actions{
        grid-template-columns:1fr;
    }

}

/* =========================
   SHOPPING CART
========================= */

.cart-section{
    max-width:1200px;
    margin:60px auto;
    padding:0 20px;
}

.cart-container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
    align-items:start;
}

.cart-items,
.cart-summary{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:24px;
}

.cart-items h2,
.cart-summary h2{
    margin-top:0;
    margin-bottom:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ececec;
}

.summary-row:last-of-type{
    border-bottom:none;
    font-size:1.1rem;
    font-weight:700;
}

.cart-summary .btn{
    width:100%;
    margin-top:15px;
}

@media (max-width:768px){

    .cart-container{
        grid-template-columns:1fr;
    }

}
     
</style>

</head>


<body>


<header class="page-header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="header-logo">

            <img
                src="images/logo.png"
                alt="TheBestBundle">

        </a>


        <div class="header-actions">

            <button
                type="button"
                class="header-icon"
                id="pageCartButton"
                aria-label="Shopping cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <span
                    class="cart-count"
                    id="pageCartCount">
                    0
                </span>

            </button>


            <a
                href="index.html"
                class="header-icon"
                aria-label="Home">

                <i class="fa-solid fa-house"></i>

            </a>

        </div>

    </div>

</header>


<div class="back-row">

    <div class="container back-inner">

        <button
            type="button"
            class="back-button"
            onclick="returnToPreviousPage()">

            <i class="fa-solid fa-arrow-left"></i>

            Back

        </button>

    </div>

</div>


<section class="page-hero">

    <div class="container">

        <span>
            TheBestBundle Collection
        </span>

       
     <h1>
       Shopping Cart
    </h1>
        

       <p>
    Review your selected products, update quantities, and proceed to secure checkout whenever you're ready.
    </p> 

    </div>

</section>

<main class="cart-section">

    <div class="cart-container">

        <div class="cart-items">

            <h2>Your Cart</h2>

            <div id="cartItems">
                <!-- Cart items will appear here automatically -->
            </div>

        </div>

        <aside class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Items</span>
                <span id="cartCount">0</span>
            </div>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cartTotal">$0.00</strong>
            </div>

            <button id="checkoutButton" class="btn primary-btn">
                Proceed to Checkout
            </button>

            <a href="ebooks.html" class="btn secondary-btn">
                Continue Shopping
            </a>

        </aside>

    </div>

</main>



<footer class="footer">

    <div class="container">

        <div class="footer-tagline">
            LEARN • CREATE • GROW
        </div>

        <p>
            © 2026 TheBestBundle. All Rights Reserved.
        </p>

    </div>

</footer>


<script>

let ebookCart =
    JSON.parse(
        localStorage.getItem('theBestBundleCart')
    ) || [];


const pageCartCount =
    document.getElementById('pageCartCount');


function updatePageCartCount(){

    pageCartCount.textContent =
        ebookCart.length;

}


function saveEbookCart(){

    localStorage.setItem(
        'theBestBundleCart',
        JSON.stringify(ebookCart)
    );

    updatePageCartCount();

}


document
    .querySelectorAll('.add-to-cart')
    .forEach(function(button){

        button.addEventListener(
            'click',
            function(){

                const product = {

                    id:this.dataset.id,
                    name:this.dataset.name,
                    price:Number(this.dataset.price),
                    image:this.dataset.image,
                    stripe:this.dataset.stripe,
                    priceId:this.dataset.priceId
                 };

                
         const alreadyExists =
                    ebookCart.some(
                        function(item){
                            return item.id === product.id;
                        }
                    );


                if(!alreadyExists){

                    ebookCart.push(product);

                    saveEbookCart();

                }


                this.textContent =
                    '✓ Added';

                setTimeout(
                    () => {
                        this.textContent =
                            'Add to Cart';
                    },
                    1200
                );

            }
        );

    });


document
    .getElementById('pageCartButton')
    .addEventListener(
        'click',
        function(){

            window.location.href =
                'cart.html';

        }
    );


function returnToPreviousPage(){

    if(window.history.length > 1){

        window.history.back();

    }else{

        window.location.href =
            'index.html';

    }

}


updatePageCartCount();

function loadCart(){

    const cart =
        JSON.parse(localStorage.getItem('theBestBundleCart')) || [];

    const cartItems =
        document.getElementById('cartItems');

    const cartCount =
        document.getElementById('cartCount');

    const cartTotal =
        document.getElementById('cartTotal');

    cartItems.innerHTML = '';

    let total = 0;

    cart.forEach((item,index)=>{

        total += Number(item.price);

        cartItems.innerHTML += `
            <div class="cart-item">
                <strong>${item.name}</strong><br>
                $${Number(item.price).toFixed(2)}
            </div>
        `;

    });

    cartCount.textContent = cart.length;
    cartTotal.textContent =
        '$' + total.toFixed(2);

}

document.addEventListener(
    'DOMContentLoaded',
    loadCart
);

const checkoutButton = document.getElementById('checkoutButton');

if (checkoutButton) {

    checkoutButton.addEventListener('click', function () {

    if (ebookCart.length === 0) {
        alert('Your cart is empty.');
        return;
    }

    const starterBundle = ebookCart.find(
        item => item.id === 'starter-bundle'
    );

    if (starterBundle) {

        window.location.href =
            'https://buy.stripe.com/28E6oJ504fKMfHNf5h8N20p';

        return;
    }

    alert('This product is not available for checkout yet.');

});

}
     
</script>


</body>

</html>
